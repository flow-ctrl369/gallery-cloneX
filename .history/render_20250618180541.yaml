services:
  - type: web
    name: gallery-clonex
    env: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gallery-clonex-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: gallery-clonex-db
    databaseName: gallery_clonex
    user: gallery_clonex_user
    plan: starter
